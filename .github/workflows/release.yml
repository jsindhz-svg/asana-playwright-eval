name: Release checks

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          ASANA_USERNAME: ${{ secrets.ASANA_USERNAME }}
          ASANA_PASSWORD: ${{ secrets.ASANA_PASSWORD }}
        run: npx playwright test tests/smoke.spec.ts --reporter=html,list

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 30

  regression:
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        env:
          ASANA_USERNAME: ${{ secrets.ASANA_USERNAME }}
          ASANA_PASSWORD: ${{ secrets.ASANA_PASSWORD }}
        run: npx playwright test tests/asana.spec.ts --reporter=html,list

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: playwright-report/
          retention-days: 30
